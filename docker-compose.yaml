name: cakra-hackathon

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?DB_NAME is required}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cakra_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPOSITORY:-cakra-hackathon}:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADDRESS: 0.0.0.0
      PORT: "8082"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_EXP_TIME: ${JWT_EXP_TIME:?JWT_EXP_TIME is required}
      AI_CALLBACK_SECRET: ${AI_CALLBACK_SECRET:?AI_CALLBACK_SECRET is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-5}
      REGISTRATION_SESSION_TTL_MINUTES: ${REGISTRATION_SESSION_TTL_MINUTES:-15}
      PASSWORD_SESSION_TTL_MINUTES: ${PASSWORD_SESSION_TTL_MINUTES:-15}
      OTP_RESEND_COOLDOWN_MINUTES: ${OTP_RESEND_COOLDOWN_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8082/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - cakra_net

volumes:
  mariadb_data:
    name: cakra-hackathon-mariadb-data

networks:
  cakra_net:
    name: cakra-hackathon-net
